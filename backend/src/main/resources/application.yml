spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mekong_story_box}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon free tier giới hạn số kết nối; chờ tối đa 5s rồi báo bận thay vì treo thread 30s
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  transaction:
    # Transaction (kể cả đang chờ khóa SELECT ... FOR UPDATE) bị hủy sau 10s để không giữ kết nối mãi
    default-timeout: 10s
  servlet:
    multipart:
      # Upload ảnh sản phẩm: tối đa 5MB/ảnh
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:${SERVER_PORT:8080}}
  # Lấy IP thật của client từ X-Forwarded-For, chỉ khi request đi qua proxy nội bộ (Render, Docker, nginx...)
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  tomcat:
    # Chống slowloris: client giữ kết nối mà không gửi dữ liệu sẽ bị cắt sau 10s
    connection-timeout: 10s
    keep-alive-timeout: 15s
    max-connections: 2000
    accept-count: 100
    max-swallow-size: 1MB
    threads:
      max: 200
  error:
    include-message: never
    include-stacktrace: never
jwt:
  # Bắt buộc đặt JWT_SECRET (>= 32 ký tự ngẫu nhiên). Thiếu thì backend dùng khóa tạm, token mất hiệu lực khi restart.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
app:
  # Đặt false khi chạy thật: endpoint này cho khách tự đánh dấu đơn "đã thanh toán" và nhận điểm
  payment:
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  max-request-body-bytes: 65536
